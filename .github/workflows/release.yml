name: Build & Release (APK + AAB)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.format }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - format: apk
            profile: preview
            ext: apk
          - format: aab
            profile: production
            ext: aab
    permissions:
      contents: read

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli

      - name: 📱 Build ${{ matrix.format }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android \
            --profile ${{ matrix.profile }} \
            --non-interactive \
            --local \
            --output="LibreAuth-${{ github.ref_name }}.${{ matrix.ext }}"

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.format }}
          path: LibreAuth-${{ github.ref_name }}.${{ matrix.ext }}
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: build-apk
      
      - name: 📥 Download AAB
        uses: actions/download-artifact@v4
        with:
          name: build-aab

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            LibreAuth-${{ github.ref_name }}.apk
            LibreAuth-${{ github.ref_name }}.aab
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: 🚀 Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.dani47.libreauth
          releaseFiles: LibreAuth-${{ github.ref_name }}.aab
          track: alpha
          status: draft
          whatsNewDirectory: distribution/whatsnew