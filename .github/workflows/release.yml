name: Build & Release (APK + AAB)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli

      - name: 📱 Build APK (vX.X.X.apk)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android \
            --profile preview \
            --non-interactive \
            --local \
            --output="LibreAuth-${{ github.ref_name }}.apk"

      - name: 📱 Build AAB (vX.X.X.aab)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android \
            --profile production \
            --non-interactive \
            --local \
            --output="LibreAuth-${{ github.ref_name }}.aab"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            LibreAuth-${{ github.ref_name }}.apk
            LibreAuth-${{ github.ref_name }}.aab
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: 🚀 Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.dani47.libreauth
          releaseFiles: LibreAuth-${{ github.ref_name }}.aab
          track: alpha  # 'alpha' suele ser "Prueba Cerrada". Usa 'production' para el final.
          status: draft
          whatsNewDirectory: distribution/whatsnew
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt